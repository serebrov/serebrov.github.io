name: Deploy org mode content

on:
  push:
    branches:
      - master

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EMACS_VERSION: 31.1
    steps:
      - uses: actions/checkout@v4

      # Install the Emacs
      - uses: jcs090218/setup-emacs@master
        with:
          version: ${{ EMACS_VERSION }}

      - name: Checkout Content Repo
        uses: actions/checkout@v4
        with:
          # We need to specify the boken as we need write access to two
          # repositories (this and serebrov.github.io where public pages
          # are stored).
          # The token has expiration time, can be created here:
          # https://github.com/settings/tokens
          # And then added in the current repository
          # Settings - Secrets and variables - actions.
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - name: Configure git
        # We need to commit the change in the content repository.
        run: |
          git config --global user.name 'Borys Serebrov'
          git config --global user.email 'serebrov@users.noreply.github.com'
      - name: Checkout Public Pages Branch
        run: git checkout public-pages
      - name: Build Static Content
        run: make rebuild
      - name: Commit public files
        run: |
          git add -f public
          msg="rebuilding site $(date)" && git commit -m "$msg" && git push origin master
